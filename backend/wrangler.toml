name = "ivanovyordan-com-backend"
compatibility_date = "2026-01-11"
main = "functions/worker.ts"
# The MCP handler uses node:async_hooks (AsyncLocalStorage) internally.
compatibility_flags = ["nodejs_compat"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[vars]
PROFILE_NAME = "Yordan Ivanov"
PROFILE_ROLE = "coach and writer for experienced data professionals who already do a lead's job"
PROFILE_STYLE = "Pragmatic, experienced, direct, business-focused."
BOOKING_URL = "https://book.ivanovyordan.com/discovery-call"
GEMINI_MODEL = "gemini-3.7-flash"
GEMINI_EMBEDDING_MODEL = "gemini-embedding-2"

[[d1_databases]]
binding = "DB"
database_name = "ivanovyordan-com-database"
database_id = "c53a0381-251f-43de-80e0-dccecb6e9a40"

[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.txt"]
fallthrough = true

<!DOCTYPE html>
<html lang="en" data-type="service" data-radius="soft" data-buttons="tonal" data-motion="off">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="site-kind" content="other" />
    <meta name="page-type" content="service" />
    <!--app-head-->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="/feed.xml" />
    <link rel="alternate" type="application/atom+xml" title="Atom Feed" href="/atom.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400..700&family=Nunito+Sans:wght@400..600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/kit/system.css" />
    <link rel="stylesheet" href="/kit/ui/cards.css" />
    <link rel="stylesheet" href="/kit/motion/motion.css" />
    <link rel="stylesheet" href="/kit/layout/layout.css" />
    <link rel="stylesheet" href="/kit/icons/icon.css" />
    <style>
      :root {
        --p-bg: #ffffff; --p-surface: #f4f4f2; --p-ink: #111111; --p-muted: #52525b;
        --p-accent: #111111; --p-accent-ink: #ffffff; --p-action: #111111; --p-action-ink: #ffffff;
        --p-inv-bg: #111111; --p-inv-surface: #1e1e1e; --p-inv-ink: #ffffff; --p-inv-muted: #9a9a9a;
        --p-inv-accent: #ffffff; --p-inv-accent-ink: #111111; --p-inv-action: #ffffff; --p-inv-action-ink: #111111;
        --font-display: "Lora", Georgia, serif;
        --font-text: "Nunito Sans", system-ui, sans-serif;
        --display-weight: 400;
        --display-tracking: -0.015em;
        --display-tracking-xl: -0.02em;
        --ly-scale: 1.02;
      }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!-- the phone action bar must be a child of body (system.css, system.js); it stays outside React -->
    <nav class="actionbar" aria-label="Quick actions">
      <a class="btn btn--primary" href="/coaching#book">Book a discovery call</a>
    </nav>
    <script type="module" src="/index.tsx"></script>
    <script type="module" src="/kit/system.js"></script>
    <script type="module" src="/kit/motion/motion.js"></script>
    <script type="module" src="/kit/layout/layout.js"></script>
  </body>
</html>
